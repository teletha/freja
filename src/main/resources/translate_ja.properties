# Japanese overrides for the Java/Swing interface.
# Keys are the exact English source literals passed to kiss.I.translate.
# Spaces inside keys are escaped as "\ " because java.util.Properties treats an
# unescaped space as the key/value separator. Java 9+ reads bundles as UTF-8.
# Keep {0}, {1}, ... placeholders byte-for-byte identical to the key.

